<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fundamental Screener</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg:            #080c14;
        --bg-card:       #0d1117;
        --bg-hover:      #111827;
        --border:        #1e2535;
        --border-subtle: #161d2d;
        --text-primary:  #f5f5f5;
        --text-secondary:#9CA3AF;
        --text-muted:    #374162;
        --accent:        #3b82f6;
        --accent-dim:    #1d3461;
        --green:         #22c55e;
        --green-dim:     #052e16;
        --red:           #ef4444;
        --red-dim:       #2d0a0a;
        --amber:         #f59e0b;
        --amber-dim:     #2d1a00;

        --color-background-primary:   var(--bg);
        --color-background-secondary: var(--bg-card);
        --color-background-success:   var(--green-dim);
        --color-background-danger:    var(--red-dim);
        --color-background-warning:   var(--amber-dim);
        --color-background-info:      var(--accent-dim);
        --color-text-primary:         var(--text-primary);
        --color-text-secondary:       var(--text-secondary);
        --color-text-success:         var(--green);
        --color-text-danger:          var(--red);
        --color-text-warning:         var(--amber);
        --color-text-info:            var(--accent);
        --color-border-tertiary:      var(--border);
        --border-radius-md:           5px;
        --border-radius-lg:           8px;
        --font-sans:                  'Inter', sans-serif;
        --font-mono:                  'JetBrains Mono', monospace;

        --sidebar-w: 210px;
        font-size: 16px; /* base bump — all rem/em scales from here */
      }

      html, body { height: 100%; overflow: hidden; }

      body {
        font-family: 'Inter', sans-serif;
        background: var(--bg);
        color: var(--text-primary);
        -webkit-font-smoothing: antialiased;
      }

      #root { height: 100%; display: flex; flex-direction: column; }

      input[type="range"] { accent-color: var(--accent); width: 100%; }
      textarea, input { outline: none; }
      textarea:focus, input:focus { border-color: var(--accent) !important; }

      /* Dual-range sliders (Build & Test filters): the visible track/fill is
         drawn separately underneath as plain divs. Each of these two
         overlapping range inputs is made fully transparent and non-interactive
         except for its own thumb, so the min and max handles never block one
         another and both sit at the same stacking level above the track. */
      .dual-range-thumb {
        -webkit-appearance: none;
        appearance: none;
        background: transparent;
        pointer-events: none;
      }
      .dual-range-thumb::-webkit-slider-runnable-track { background: transparent; }
      .dual-range-thumb::-moz-range-track { background: transparent; border: none; }
      .dual-range-thumb::-webkit-slider-thumb {
        -webkit-appearance: none;
        pointer-events: auto;
        width: 14px; height: 14px; border-radius: 50%;
        background: var(--accent); border: 2px solid var(--text-primary);
        cursor: pointer;
      }
      .dual-range-thumb::-moz-range-thumb {
        pointer-events: auto;
        width: 14px; height: 14px; border-radius: 50%;
        background: var(--accent); border: 2px solid var(--text-primary);
        cursor: pointer;
      }
      .dual-range-thumb:disabled::-webkit-slider-thumb { background: var(--text-muted); border-color: var(--border); cursor: not-allowed; }
      .dual-range-thumb:disabled::-moz-range-thumb { background: var(--text-muted); border-color: var(--border); cursor: not-allowed; }

      /* Editable min/max labels above each range slider — look like plain
         text, not boxed inputs, and drop the native spinner arrows. */
      .range-number-input { -moz-appearance: textfield; }
      .range-number-input::-webkit-inner-spin-button,
      .range-number-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
      code {
        font-family: var(--font-mono);
        background: var(--bg-hover);
        padding: 1px 6px;
        border-radius: 4px;
        font-size: 0.88em;
      }
      * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }

      /* Mobile responsive styles */
      @media (max-width: 768px) {
        :root {
          font-size: 14px;
        }

        html, body {
          overflow: auto;
        }

        #root {
          overflow: auto;
        }
      }

      @media (max-width: 640px) {
        :root {
          font-size: 13px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
